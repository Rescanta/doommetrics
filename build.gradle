plugins {
	id 'java'
	id 'checkstyle'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.rescanta.doommetrics.DoomMetricsPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.rescanta.doommetrics'

// The plugin hub's hard rules, as a build failure - see config/checkstyle/checkstyle.xml.
// Pinned to the last Checkstyle line that runs on JDK 11, which is what this plugin builds with.
checkstyle {
	toolVersion = '10.26.1'
	sourceSets = [sourceSets.main]
	maxWarnings = 0
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

tasks.register('preview', JavaExec) {
	description = 'Opens the interface preview harness: the plugin widgets, with no game under them'
	group = 'application'

	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.rescanta.doommetrics.PreviewWindow'
}

tasks.register('previewShots', JavaExec) {
	description = 'Writes a picture of every previewed interface state to build/preview'
	group = 'application'

	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.rescanta.doommetrics.PreviewShots'
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

// Two packaging rules the hub also rejects on. Checkstyle only reads .java files,
// so they are checked here rather than in checkstyle.xml.
tasks.register('verifyPluginPackaging') {
	description = 'Fails on a Plugin services file or committed build artifacts'
	group = 'verification'

	def serviceFiles = fileTree('src') {
		include '**/META-INF/services/net.runelite.client.plugins.Plugin'
	}
	def strayArtifacts = fileTree(projectDir) {
		include '**/*.class'
		exclude 'build/**', '.gradle/**', '.git/**', '.idea/**'
	}

	doLast {
		if (!serviceFiles.empty) {
			throw new GradleException("Remove ${serviceFiles.files.join(', ')} - the hub loads plugins from runelite-plugin.properties (AGENTS.md: Plugin Setup and Packaging).")
		}

		if (!strayArtifacts.empty) {
			throw new GradleException("Build artifacts must not be committed: ${strayArtifacts.files.join(', ')} (AGENTS.md: Plugin Setup and Packaging).")
		}
	}
}

tasks.named('check') {
	dependsOn 'verifyPluginPackaging'
}
